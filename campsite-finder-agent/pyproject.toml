[project]
name = "campsite-finder-agent"
version = "0.1.0"
description = "Local-first Recreation.gov campsite availability watcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-dotenv>=1.1.0",
  "pyyaml>=6.0.0",
  "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]
browser = [
  "playwright>=1.49.0",
]

[project.scripts]
campsite-finder-agent = "campsite_finder_agent.main:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
