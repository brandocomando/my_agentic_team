version: "3"

vars:
  CDP_URL: "http://localhost:9222"
  CDP_PORT: "9222"
  CHROME_PROFILE: "{{.HOME}}/.campsite-finder-chrome"
  CHROME_APP: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

tasks:
  sync:
    desc: Install dependencies
    cmds:
      - uv sync --extra dev --extra browser

  test:
    desc: Run tests
    cmds:
      - uv run --extra dev pytest

  chrome:
    desc: Start a dedicated Chrome profile with remote debugging enabled
    cmds:
      - '"{{.CHROME_APP}}" --remote-debugging-port={{.CDP_PORT}} --user-data-dir="{{.CHROME_PROFILE}}"'

  run:
    desc: Run the campsite finder directly; pass args with `--`
    cmds:
      - uv run --extra browser python app.py {{.CLI_ARGS}}

  scan:
    desc: Scan configured Recreation.gov campgrounds once
    cmds:
      - uv run --extra browser python app.py --cdp-url {{.CDP_URL}} --once {{.CLI_ARGS}}

  locks:reservecalifornia:
    desc: Report ReserveCalifornia grid lock icons for a URL/date range
    cmds:
      - uv run --extra browser python app.py --cdp-url {{.CDP_URL}} --reservecalifornia-locks {{.CLI_ARGS}}

  get_site:
    desc: Book-assist a target site on ReserveCalifornia or Recreation.gov based on CAMPGROUND_URL
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        for arg in {{.CLI_ARGS}}; do
          case "$arg" in
            *=*) export "$arg" ;;
          esac
        done
        CAMPGROUND_URL="${CAMPGROUND_URL:-${CAMPSITE_GET_SITE_CAMPGROUND_URL:-}}"
        case "$CAMPGROUND_URL" in
          *recreation.gov*) PROVIDER="recreation" ;;
          *reservecalifornia.com*) PROVIDER="reservecalifornia" ;;
          *) PROVIDER="" ;;
        esac
        SITE="${SITE:-${CAMPSITE_GET_SITE_SITE:-}}"
        START_DATE="${START_DATE:-${CAMPSITE_GET_SITE_START_DATE:-}}"
        NIGHTS="${NIGHTS:-${CAMPSITE_GET_SITE_NIGHTS:-}}"
        OCCUPANT="${OCCUPANT:-${OCCUPANT_NAME:-}}"
        OCCUPANT="${OCCUPANT:-${CAMPSITE_GET_SITE_OCCUPANT:-}}"
        OCCUPANT="${OCCUPANT:-${CAMPSITE_GET_SITE_OCCUPANT_NAME:-}}"
        TRAILER_LENGTH="${TRAILER_LENGTH:-${CAMPSITE_GET_SITE_TRAILER_LENGTH_FEET:-}}"
        VEHICLE_COUNT="${VEHICLE_COUNT:-${CAMPSITE_GET_SITE_VEHICLE_COUNT:-}}"
        PHONE_NUMBER="${PHONE_NUMBER:-${CAMPSITE_GET_SITE_PHONE_NUMBER:-}}"
        STREET_1="${STREET_1:-${CAMPSITE_GET_SITE_STREET_1:-}}"
        CITY="${CITY:-${CAMPSITE_GET_SITE_CITY:-}}"
        STATE="${STATE:-${CAMPSITE_GET_SITE_STATE:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${ZIPCODE:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${CAMPSITE_GET_SITE_POSTAL_CODE:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${CAMPSITE_GET_SITE_ZIPCODE:-}}"
        : "${SITE:?SITE is required, e.g. SITE=131}"
        : "${START_DATE:?START_DATE is required, e.g. START_DATE=8/21/26}"
        : "${NIGHTS:?NIGHTS is required, e.g. NIGHTS=2}"
        : "${CAMPGROUND_URL:?CAMPGROUND_URL is required}"
        if [ "$PROVIDER" = "reservecalifornia" ]; then
          : "${OCCUPANT:?OCCUPANT is required for ReserveCalifornia, e.g. OCCUPANT='Brandon Foster'}"
        fi
        if [ "$PROVIDER" = "recreation" ]; then
          REFRESH_WINDOW_START="${REFRESH_WINDOW_START:-${CAMPSITE_GET_SITE_REFRESH_WINDOW_START:-06:59:30}}"
          REFRESH_WINDOW_END="${REFRESH_WINDOW_END:-${CAMPSITE_GET_SITE_REFRESH_WINDOW_END:-07:01:00}}"
          REFRESH_TIMEZONE="${REFRESH_TIMEZONE:-${CAMPSITE_GET_SITE_REFRESH_TIMEZONE:-America/Los_Angeles}}"
          REFRESH_INTERVAL_SECONDS="${REFRESH_INTERVAL_SECONDS:-${CAMPSITE_GET_SITE_REFRESH_INTERVAL_SECONDS:-1}}"
          MAX_RUN_SECONDS="${MAX_RUN_SECONDS:-${CAMPSITE_GET_SITE_MAX_RUN_SECONDS:-}}"
        else
          REFRESH_WINDOW_START="${REFRESH_WINDOW_START:-${CAMPSITE_GET_SITE_REFRESH_WINDOW_START:-07:59:30}}"
          REFRESH_WINDOW_END="${REFRESH_WINDOW_END:-${CAMPSITE_GET_SITE_REFRESH_WINDOW_END:-08:01:00}}"
          REFRESH_TIMEZONE="${REFRESH_TIMEZONE:-${CAMPSITE_GET_SITE_REFRESH_TIMEZONE:-America/Los_Angeles}}"
          REFRESH_INTERVAL_SECONDS="${REFRESH_INTERVAL_SECONDS:-${CAMPSITE_GET_SITE_REFRESH_INTERVAL_SECONDS:-1}}"
          MAX_RUN_SECONDS="${MAX_RUN_SECONDS:-${CAMPSITE_GET_SITE_MAX_RUN_SECONDS:-}}"
        fi
        uv run --extra browser python app.py \
          --cdp-url "{{.CDP_URL}}" \
          --get-site \
          --park-url "$CAMPGROUND_URL" \
          --site "$SITE" \
          --start-date "$START_DATE" \
          --nights "$NIGHTS" \
          --adults "${ADULTS:-${CAMPSITE_GET_SITE_ADULTS:-2}}" \
          --children "${CHILDREN:-${CAMPSITE_GET_SITE_CHILDREN:-2}}" \
          --occupant-name "$OCCUPANT" \
          --camping-unit "${CAMPING_UNIT:-${CAMPSITE_GET_SITE_CAMPING_UNIT:-Trailer}}" \
          ${TRAILER_LENGTH:+--trailer-length-feet "$TRAILER_LENGTH"} \
          ${VEHICLE_COUNT:+--vehicle-count "$VEHICLE_COUNT"} \
          --phone-number "$PHONE_NUMBER" \
          --street-1 "$STREET_1" \
          --city "$CITY" \
          --state "$STATE" \
          --postal-code "$POSTAL_CODE" \
          --refresh-window-start "$REFRESH_WINDOW_START" \
          --refresh-window-end "$REFRESH_WINDOW_END" \
          --refresh-timezone "$REFRESH_TIMEZONE" \
          --refresh-interval-seconds "$REFRESH_INTERVAL_SECONDS" \
          ${MAX_RUN_SECONDS:+--max-run-seconds "$MAX_RUN_SECONDS"} \
          ${NO_CLICK_BOOK_NOW:+--no-click-book-now} \
          ${NO_CLICK_RESERVE_UNIT:+--no-click-reserve-unit} \
          ${NO_CLICK_PAYMENT_NEXT:+--no-click-payment-next}

  practice_site:
    desc: Immediately practice selecting an available ReserveCalifornia site and clicking Book Now
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        for arg in {{.CLI_ARGS}}; do
          case "$arg" in
            *=*) export "$arg" ;;
          esac
        done
        CAMPGROUND_URL="${CAMPGROUND_URL:-${CAMPSITE_GET_SITE_CAMPGROUND_URL:-}}"
        case "$CAMPGROUND_URL" in
          *recreation.gov*) PROVIDER="recreation" ;;
          *reservecalifornia.com*) PROVIDER="reservecalifornia" ;;
          *) PROVIDER="" ;;
        esac
        SITE="${SITE:-${CAMPSITE_GET_SITE_SITE:-}}"
        START_DATE="${START_DATE:-${CAMPSITE_GET_SITE_START_DATE:-}}"
        NIGHTS="${NIGHTS:-${CAMPSITE_GET_SITE_NIGHTS:-}}"
        OCCUPANT="${OCCUPANT:-${OCCUPANT_NAME:-}}"
        OCCUPANT="${OCCUPANT:-${CAMPSITE_GET_SITE_OCCUPANT:-}}"
        OCCUPANT="${OCCUPANT:-${CAMPSITE_GET_SITE_OCCUPANT_NAME:-}}"
        TRAILER_LENGTH="${TRAILER_LENGTH:-${CAMPSITE_GET_SITE_TRAILER_LENGTH_FEET:-}}"
        VEHICLE_COUNT="${VEHICLE_COUNT:-${CAMPSITE_GET_SITE_VEHICLE_COUNT:-}}"
        PHONE_NUMBER="${PHONE_NUMBER:-${CAMPSITE_GET_SITE_PHONE_NUMBER:-}}"
        STREET_1="${STREET_1:-${CAMPSITE_GET_SITE_STREET_1:-}}"
        CITY="${CITY:-${CAMPSITE_GET_SITE_CITY:-}}"
        STATE="${STATE:-${CAMPSITE_GET_SITE_STATE:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${ZIPCODE:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${CAMPSITE_GET_SITE_POSTAL_CODE:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${CAMPSITE_GET_SITE_ZIPCODE:-}}"
        : "${SITE:?SITE is required, e.g. SITE=131}"
        : "${START_DATE:?START_DATE is required, e.g. START_DATE=8/21/26}"
        : "${NIGHTS:?NIGHTS is required, e.g. NIGHTS=2}"
        : "${CAMPGROUND_URL:?CAMPGROUND_URL is required}"
        if [ "$PROVIDER" = "reservecalifornia" ]; then
          : "${OCCUPANT:?OCCUPANT is required for ReserveCalifornia, e.g. OCCUPANT='Brandon Foster'}"
        fi
        if [ "$PROVIDER" = "recreation" ]; then
          REFRESH_TIMEZONE="${REFRESH_TIMEZONE:-${CAMPSITE_GET_SITE_REFRESH_TIMEZONE:-America/Los_Angeles}}"
          REFRESH_INTERVAL_SECONDS="${REFRESH_INTERVAL_SECONDS:-${CAMPSITE_GET_SITE_REFRESH_INTERVAL_SECONDS:-0.2}}"
          MAX_RUN_SECONDS="${MAX_RUN_SECONDS:-${CAMPSITE_GET_SITE_MAX_RUN_SECONDS:-20}}"
        else
          REFRESH_TIMEZONE="${REFRESH_TIMEZONE:-${CAMPSITE_GET_SITE_REFRESH_TIMEZONE:-America/Los_Angeles}}"
          REFRESH_INTERVAL_SECONDS="${REFRESH_INTERVAL_SECONDS:-${CAMPSITE_GET_SITE_REFRESH_INTERVAL_SECONDS:-0.2}}"
          MAX_RUN_SECONDS="${MAX_RUN_SECONDS:-${CAMPSITE_GET_SITE_MAX_RUN_SECONDS:-20}}"
        fi
        uv run --extra browser python app.py \
          --cdp-url "{{.CDP_URL}}" \
          --get-site \
          --park-url "$CAMPGROUND_URL" \
          --site "$SITE" \
          --start-date "$START_DATE" \
          --nights "$NIGHTS" \
          --adults "${ADULTS:-${CAMPSITE_GET_SITE_ADULTS:-2}}" \
          --children "${CHILDREN:-${CAMPSITE_GET_SITE_CHILDREN:-2}}" \
          --occupant-name "$OCCUPANT" \
          --camping-unit "${CAMPING_UNIT:-${CAMPSITE_GET_SITE_CAMPING_UNIT:-Trailer}}" \
          ${TRAILER_LENGTH:+--trailer-length-feet "$TRAILER_LENGTH"} \
          ${VEHICLE_COUNT:+--vehicle-count "$VEHICLE_COUNT"} \
          --phone-number "$PHONE_NUMBER" \
          --street-1 "$STREET_1" \
          --city "$CITY" \
          --state "$STATE" \
          --postal-code "$POSTAL_CODE" \
          --refresh-window-start "00:00:00" \
          --refresh-window-end "23:59:59" \
          --refresh-timezone "$REFRESH_TIMEZONE" \
          --refresh-interval-seconds "$REFRESH_INTERVAL_SECONDS" \
          --max-run-seconds "$MAX_RUN_SECONDS" \
          ${NO_CLICK_BOOK_NOW:+--no-click-book-now} \
          ${NO_CLICK_RESERVE_UNIT:+--no-click-reserve-unit} \
          ${NO_CLICK_PAYMENT_NEXT:+--no-click-payment-next}

  get_recreation_site:
    desc: Poll Recreation.gov until a target site is released/available, e.g. `task get_recreation_site -- SITE=118 START_DATE=3/20/27 NIGHTS=2 CAMPGROUND_URL=https://www.recreation.gov/camping/campgrounds/232250`
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        for arg in {{.CLI_ARGS}}; do
          case "$arg" in
            *=*) export "$arg" ;;
          esac
        done
        SITE="${SITE:-${CAMPSITE_GET_SITE_SITE:-}}"
        START_DATE="${START_DATE:-${CAMPSITE_GET_SITE_START_DATE:-}}"
        NIGHTS="${NIGHTS:-${CAMPSITE_GET_SITE_NIGHTS:-}}"
        CAMPGROUND_URL="${CAMPGROUND_URL:-${CAMPSITE_GET_SITE_CAMPGROUND_URL:-}}"
        MAX_RUN_SECONDS="${MAX_RUN_SECONDS:-${CAMPSITE_GET_SITE_MAX_RUN_SECONDS:-}}"
        TRAILER_LENGTH="${TRAILER_LENGTH:-${CAMPSITE_GET_SITE_TRAILER_LENGTH_FEET:-}}"
        VEHICLE_COUNT="${VEHICLE_COUNT:-${CAMPSITE_GET_SITE_VEHICLE_COUNT:-}}"
        PHONE_NUMBER="${PHONE_NUMBER:-${CAMPSITE_GET_SITE_PHONE_NUMBER:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${ZIPCODE:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${CAMPSITE_GET_SITE_POSTAL_CODE:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${CAMPSITE_GET_SITE_ZIPCODE:-}}"
        : "${SITE:?SITE is required, e.g. SITE=118}"
        : "${START_DATE:?START_DATE is required, e.g. START_DATE=3/20/27}"
        : "${NIGHTS:?NIGHTS is required, e.g. NIGHTS=2}"
        : "${CAMPGROUND_URL:?CAMPGROUND_URL is required}"
        uv run --extra browser python app.py \
          --cdp-url "{{.CDP_URL}}" \
          --get-recreation-site \
          --park-url "$CAMPGROUND_URL" \
          --site "$SITE" \
          --start-date "$START_DATE" \
          --nights "$NIGHTS" \
          --adults "${ADULTS:-${CAMPSITE_GET_SITE_ADULTS:-2}}" \
          --children "${CHILDREN:-${CAMPSITE_GET_SITE_CHILDREN:-2}}" \
          --camping-unit "${CAMPING_UNIT:-${CAMPSITE_GET_SITE_CAMPING_UNIT:-Trailer}}" \
          ${TRAILER_LENGTH:+--trailer-length-feet "$TRAILER_LENGTH"} \
          ${VEHICLE_COUNT:+--vehicle-count "$VEHICLE_COUNT"} \
          --phone-number "$PHONE_NUMBER" \
          --postal-code "$POSTAL_CODE" \
          --refresh-window-start "${REFRESH_WINDOW_START:-${CAMPSITE_GET_SITE_REFRESH_WINDOW_START:-06:59:30}}" \
          --refresh-window-end "${REFRESH_WINDOW_END:-${CAMPSITE_GET_SITE_REFRESH_WINDOW_END:-07:01:00}}" \
          --refresh-timezone "${REFRESH_TIMEZONE:-${CAMPSITE_GET_SITE_REFRESH_TIMEZONE:-America/Los_Angeles}}" \
          --refresh-interval-seconds "${REFRESH_INTERVAL_SECONDS:-${CAMPSITE_GET_SITE_REFRESH_INTERVAL_SECONDS:-1}}" \
          ${MAX_RUN_SECONDS:+--max-run-seconds "$MAX_RUN_SECONDS"} \
          ${NO_CLICK_BOOK_NOW:+--no-click-book-now} \
          ${NO_CLICK_RESERVE_UNIT:+--no-click-reserve-unit} \
          ${NO_CLICK_PAYMENT_NEXT:+--no-click-payment-next}

  practice_recreation_site:
    desc: Immediately poll Recreation.gov for a target site status
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        for arg in {{.CLI_ARGS}}; do
          case "$arg" in
            *=*) export "$arg" ;;
          esac
        done
        SITE="${SITE:-${CAMPSITE_GET_SITE_SITE:-}}"
        START_DATE="${START_DATE:-${CAMPSITE_GET_SITE_START_DATE:-}}"
        NIGHTS="${NIGHTS:-${CAMPSITE_GET_SITE_NIGHTS:-}}"
        CAMPGROUND_URL="${CAMPGROUND_URL:-${CAMPSITE_GET_SITE_CAMPGROUND_URL:-}}"
        TRAILER_LENGTH="${TRAILER_LENGTH:-${CAMPSITE_GET_SITE_TRAILER_LENGTH_FEET:-}}"
        VEHICLE_COUNT="${VEHICLE_COUNT:-${CAMPSITE_GET_SITE_VEHICLE_COUNT:-}}"
        PHONE_NUMBER="${PHONE_NUMBER:-${CAMPSITE_GET_SITE_PHONE_NUMBER:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${ZIPCODE:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${CAMPSITE_GET_SITE_POSTAL_CODE:-}}"
        POSTAL_CODE="${POSTAL_CODE:-${CAMPSITE_GET_SITE_ZIPCODE:-}}"
        : "${SITE:?SITE is required, e.g. SITE=118}"
        : "${START_DATE:?START_DATE is required, e.g. START_DATE=3/20/27}"
        : "${NIGHTS:?NIGHTS is required, e.g. NIGHTS=2}"
        : "${CAMPGROUND_URL:?CAMPGROUND_URL is required}"
        uv run --extra browser python app.py \
          --cdp-url "{{.CDP_URL}}" \
          --get-recreation-site \
          --park-url "$CAMPGROUND_URL" \
          --site "$SITE" \
          --start-date "$START_DATE" \
          --nights "$NIGHTS" \
          --adults "${ADULTS:-${CAMPSITE_GET_SITE_ADULTS:-2}}" \
          --children "${CHILDREN:-${CAMPSITE_GET_SITE_CHILDREN:-2}}" \
          --camping-unit "${CAMPING_UNIT:-${CAMPSITE_GET_SITE_CAMPING_UNIT:-Trailer}}" \
          ${TRAILER_LENGTH:+--trailer-length-feet "$TRAILER_LENGTH"} \
          ${VEHICLE_COUNT:+--vehicle-count "$VEHICLE_COUNT"} \
          --phone-number "$PHONE_NUMBER" \
          --postal-code "$POSTAL_CODE" \
          --refresh-window-start "00:00:00" \
          --refresh-window-end "23:59:59" \
          --refresh-timezone "${REFRESH_TIMEZONE:-${CAMPSITE_GET_SITE_REFRESH_TIMEZONE:-America/Los_Angeles}}" \
          --refresh-interval-seconds "${REFRESH_INTERVAL_SECONDS:-${CAMPSITE_GET_SITE_REFRESH_INTERVAL_SECONDS:-0.2}}" \
          --max-run-seconds "${MAX_RUN_SECONDS:-${CAMPSITE_GET_SITE_MAX_RUN_SECONDS:-20}}" \
          ${NO_CLICK_BOOK_NOW:+--no-click-book-now} \
          ${NO_CLICK_RESERVE_UNIT:+--no-click-reserve-unit} \
          ${NO_CLICK_PAYMENT_NEXT:+--no-click-payment-next}

  discover:
    desc: Discover Outdoorithm campground IDs for a state, e.g. `task discover -- CA`
    cmds:
      - uv run python app.py --discover-state {{.CLI_ARGS}}

  watch:
    desc: Keep scanning configured Recreation.gov campgrounds
    cmds:
      - uv run --extra browser python app.py --cdp-url {{.CDP_URL}} --watch {{.CLI_ARGS}}

  hourly:
    desc: Keep scanning configured campgrounds every hour
    cmds:
      - uv run --extra browser python app.py --cdp-url {{.CDP_URL}} --watch --interval-seconds 3600 {{.CLI_ARGS}}
