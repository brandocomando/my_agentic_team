<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Survey Copilot Agent</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Survey Copilot</h1>
        <p id="page-status">Ready</p>
      </div>
      <button id="refresh-button" type="button">Refresh</button>
    </header>

    <nav class="tabs" aria-label="Survey Copilot views">
      <button class="tab active" data-tab="questions" type="button">Questions</button>
      <button class="tab" data-tab="memory" type="button">Memory</button>
      <button class="tab" data-tab="settings" type="button">Settings</button>
    </nav>

    <main>
      <section id="questions-tab" class="tab-panel active">
        <div id="question-list" class="stack"></div>
      </section>

      <section id="memory-tab" class="tab-panel">
        <form id="fact-form" class="memory-form">
          <label>
            Label
            <input name="label" type="text" autocomplete="off" required>
          </label>
          <label>
            Question keywords
            <input name="questionPattern" type="text" autocomplete="off" required>
          </label>
          <label>
            Answer
            <input name="answer" type="text" autocomplete="off" required>
          </label>
          <label>
            Expires
            <select name="ttlDays">
              <option value="">Never</option>
              <option value="7">7 days</option>
              <option value="30">30 days</option>
              <option value="90">90 days</option>
            </select>
          </label>
          <button type="submit">Save Fact</button>
        </form>

        <div class="memory-tools">
          <button id="export-memory-button" type="button">Export Memory</button>
        </div>

        <h2>Profile Facts</h2>
        <div id="fact-list" class="stack"></div>

        <h2>Confirmed Answers</h2>
        <div id="answer-list" class="stack"></div>
      </section>

      <section id="settings-tab" class="tab-panel">
        <form id="settings-form" class="memory-form">
          <label class="checkbox-label">
            <input name="llmEnabled" type="checkbox">
            Enable LLM suggestions
          </label>
          <label>
            Local helper URL
            <input name="helperUrl" type="url" value="http://127.0.0.1:8765" required>
          </label>
          <label>
            Allowed domains
            <textarea name="allowedHosts" rows="5" spellcheck="false">file:
localhost
127.0.0.1</textarea>
          </label>
          <div class="actions split-actions">
            <button id="test-helper-button" type="button">Test Helper</button>
            <button class="primary" type="submit">Save Settings</button>
          </div>
        </form>

        <div id="llm-status" class="empty-state">
          LLM suggestions are optional. The extension keeps using saved memory when the helper is off or unavailable.
        </div>
      </section>
    </main>

    <script src="shared/normalize.js"></script>
    <script src="shared/memory.js"></script>
    <script src="shared/llmClient.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
